<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | Automagy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Tahoma, sans-serif;
      background: #08111f;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      width: 100%;
      padding: 45px 25px;
      background: #101d32;
      border: 1px solid #24344d;
      border-radius: 20px;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 72px;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #b8c4d6;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      background: #38bdf8;
      color: #08111f;
      text-decoration: none;
      font-weight: bold;
      padding: 13px 25px;
      border-radius: 10px;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="icon">🤖</div>

    <h1>404</h1>

    <h2>الصفحة غير موجودة</h2>

    <p>
      عذراً، الصفحة التي تبحث عنها غير موجودة
      أو ربما تم تغيير الرابط.
    </p>

    <a href="/automagy/">
      🏠 العودة إلى Automagy
    </a>
  </div>

</body>
</html>
