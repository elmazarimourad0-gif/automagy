<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automagy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 50px 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #38bdf8;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 15px 35px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
    }

    .button:hover {
      background: #7dd3fc;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">AUTOMAGY</div>

    <h1>مرحبا بك في Automagy</h1>

    <p>
      منصة بسيطة لاكتشاف عالم الأتمتة والأدوات الذكية.
      خليك قريب، المشروع غادي يكبر خطوة بخطوة.
    </p>

    <a href="#" class="button">اكتشف المزيد</a>
  </div>

</body>
</html>
